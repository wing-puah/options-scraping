# config/macro-events.yml
# Scheduled US macro releases the study tier conditions on. HAND-AUTHORED from
# the official published schedules (transcribed 2026-08-19 via live fetches of
# the pages below; BLS pages read through a text-rendering proxy of the same
# URLs). Every date is public record. NOT read by production - nothing under
# scripts/backtest/, scripts/journal/ or repo lib/ imports this file.
#
# Loader + semantics: scripts/backtest_study/lib/macro_calendar.py.
# release_et is Eastern; pre-open (< 09:30) prints are in the next-open entry
# fill, post-open ones are not. The 2025 government-shutdown gaps are REAL
# (no Oct-2025-reference CPI/NFP; Sep-2025 releases delayed; PCE Oct+Nov 2025
# combined) - do not "fix" them to the usual cadence.
# Known omission: an "August 22 (notation vote)" line appears under 2025 on the
# FOMC calendar page with no policy action detail; not transcribed (it is not
# a scheduled release and its content could not be verified).
meta:
  compiled: 2026-08-19
  sources:
    fomc: "federalreserve.gov/monetarypolicy/fomccalendars.htm - decision = last day of each meeting, statement 14:00 ET"
    fomc_minutes: "same page - released 14:00 ET, ~3 weeks after the decision; only released dates are entered"
    cpi: "bls.gov/schedule/news_release/cpi.htm + bls.gov/schedule/<YYYY>/home.htm archives - 08:30 ET"
    nfp: "bls.gov/schedule/news_release/empsit.htm + per-year archives - Employment Situation, 08:30 ET"
    pce: "bea.gov/news/schedule + per-release pages bea.gov/news/<YYYY>/personal-income-and-outlays-* - Personal Income & Outlays, 08:30 ET unless noted"
  # Per type, the last date the OFFICIAL schedule is published through. A
  # forward query past this returns None rather than "no event ahead".
  # fomc_minutes releases are not scheduled in advance, so its horizon is the
  # compile date; the others end with their last published schedule entry.
  verified_through:
    fomc: 2027-12-31
    fomc_minutes: 2026-08-19
    cpi: 2026-12-31
    nfp: 2026-12-31
    pce: 2026-12-31
