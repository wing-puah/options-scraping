# config/fomc-history.yml
# Scheduled FOMC decision days, 1994-01-01 to 2023-05-31, for the calendar_drift
# study (research/pre-registrations/f1_selection/signal/calendar_drift.md).
# HAND-AUTHORED from the Federal Reserve's own historical pages, fetched
# 2026-11-27 (raw HTML downloaded, meeting headings transcribed verbatim into
# `label`). Every date is public record. NOT read by production - only the
# study tier reads this file. From 2023-06 on, the study reads the `fomc`
# entries of config/macro-events.yml instead; this file stops before them.
#
# Decision day = the LAST day of a scheduled meeting, whether or not a statement
# was issued (before mid-1999 the Fed issued one only when policy changed).
#
# EXCLUDED (listed under `excluded:` for audit, never events): conference calls,
# meetings marked "(unscheduled)", notation votes, the cancelled March 17-18,
# 2020 meeting, and the September 15, 2003 special meeting on communication
# practice (the August 2003 minutes name September 16 as the next regular
# meeting; the page files the statement, Greenbook and Bluebook under Sep 16).
#
# A date may change only under the registration's transcription-fix rule:
# the Fed's own page proves it wrong, and the fix is tagged there.
meta:
  compiled: 2026-11-27
  sources:
    "1994-2020": "federalreserve.gov/monetarypolicy/fomchistorical<YYYY>.htm (linked from fomc_historical_year.htm) - one heading per meeting or call"
    "2021-2023": "federalreserve.gov/monetarypolicy/fomccalendars.htm - the per-year historical pages 404 for these years; the calendar page lists them"
    "2003-09-15": "federalreserve.gov/fomc/minutes/20030812.htm - names Sep 16, 2003 as the next regular meeting; Sep 15 met on communication practice"
  coverage: {start: 1994-01-01, end: 2023-05-31}
  # 2023 is partial by design (Jan-May; three decisions). Gate GF checks 1994-2022.
  # Years 1994-2022 without exactly eight scheduled decision days:
  exceptions:
    2020: "seven: the March 17-18 meeting was cancelled and replaced by the unscheduled March 15 action"
