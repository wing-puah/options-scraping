name: Daily Trade Journal

# PRODUCTION TIER. Runs `python3 -m scripts.journal` (fetch -> reconcile -> risk
# -> report -> write) once per weekday after the US close, so the analysis ->
# trade -> evidence loop closes daily instead of only on days someone happens
# to run it by hand (research/robustness-review.md P8 — reports existed only
# for 2026-08-25, 08-26, 08-28, 08-31 and 09-03 before this workflow).
#
# Scheduled well after 16:00 ET close in EITHER daylight regime: EST close is
# 21:00 UTC, EDT close is 20:00 UTC, so 22:15 UTC is close+1h15m (EST) to
# close+2h15m (EDT) — enough buffer for the Flex Web Service to stop answering
# "generation in progress" (`lib/ibkr/flex.py::FlexClient` already retries that).
#
# IT IS NOT ENOUGH FOR THE DAY'S OWN FILLS, AND CANNOT BE. IBKR's processing
# cycle publishes a session the morning ET AFTER it closes: a trades query
# answered at 03:19 UTC on 2026-09-19 — 23:19 ET Friday, close+7h — still ended
# at 2026-09-17. So this run journals the PREVIOUS session, which is why
# `scripts/check_pipeline.py::JOURNAL_STAGE` carries lag_sessions=1. Moving this
# cron a couple of hours later does not fix that; only running it the NEXT
# morning ET would, and that is a different design (it would journal D on D+1).
#
# Data sources: IBKR Flex (trades + open positions, IBKR_FLEX_TOKEN et al.) and
# Barchart (EOD greeks for the open book when Flex doesn't carry them,
# `scripts/journal/lib/greeks.py` — needs the full requirements.txt/Playwright
# set, same as enrich-oi.yml). This is the bare `run` command, NOT
# `recommend`: it never makes the pipeline's one model call
# (`s06_recommend.py`), so no ANTHROPIC_API_KEY is needed here.
#
# journal/ is gitignored (account ids, live position sizes, P&L) and MUST stay
# that way — this workflow never commits it and never uploads it as a build
# artifact. Its permitted remote destinations are the TradeJournal / OpenBook
# Sheets tabs in TRADE_JOURNAL_SPREADSHEET_ID and the private Drive folder named
# by JOURNAL_DRIVE_FOLDER_ID (see scripts/journal/config.py's DATA PRIVACY note).
#
# THE RUN IS --quiet, AND THAT IS THE POINT. A GitHub Actions log is readable by
# anyone with access to the repo and is retained for 90 days; the report the
# journal prints names tickers, position sizes and P&L. --quiet keeps all of it
# off stdout and leaves it in Drive instead: reports and deploy cards grouped one
# file per month inside a YYYY-MM/ folder, the broker pull appended to that
# month's JSONL beside them, the page as journal-latest.html at the root, and
# the three append-only archives round-tripped under _history/ — pulled
# before the writers so `generation` keeps counting across runs, pushed after.
# Without that round trip a runner's empty disk restarts every generation at 1.
# Read the result with `make journal-page-pull`.
#
# --quiet REFUSES TO RUN without JOURNAL_DRIVE_FOLDER_ID, before any network
# call: a silent run with nowhere to put its output produces nothing at all. So
# the secret below is required here, not optional — and a Drive failure exits 4
# and fails this workflow, deliberately, for the same reason.
#
# The watchdog side of P8 (a missing daily journal mark failing
# scripts/check_pipeline.py) is wired into that script directly rather than
# into pipeline-health.yml's own env — see check_pipeline.py::JOURNAL_STAGE.
#
# FRESH-RUNNER RETRY ON A REFUSED BARCHART LOGIN (added 2026-09-22, run
# 35673363388). Barchart intermittently refuses a fresh login from a
# GitHub-hosted runner's IP — silent stay-on-/login, every in-process retry of
# one run failing together (lib/barchart/session.py::BarchartSession._LOGIN_
# ATTEMPTS already retries within one run; this is what to do once THAT is
# exhausted). A NEW runner (new IP) usually clears it, so the operator's
# decision is: retry on a fresh runner, not fall back to a login-free data
# path. Three jobs, each its own runner:
#
#   attempt-1, attempt-2  — JOURNAL_GREEKS_REQUIRED=1, so `pull_flex` (see
#                           scripts/journal/s01_pull.py) RE-RAISES
#                           BarchartAuthError instead of degrading to a
#                           greeks-less journal. `scripts/journal/__main__.py`
#                           catches it and exits EXIT_BARCHART_AUTH (5, shared
#                           with every scraper via lib/barchart/session.py::
#                           BARCHART_AUTH_EXIT_CODE so the number can't drift).
#                           The "Evaluate" step captures that exit code
#                           WITHOUT failing the job (continue-on-error on the
#                           run step) UNLESS it is some OTHER nonzero code — a
#                           real bug must still fail the workflow loudly and
#                           NOT be retried into more runner-minutes.
#   attempt-3 (final)      — runs WITHOUT the flag, exactly as this workflow
#                           always has: a refused login degrades to a
#                           greeks-less journal (`greeks_unavailable` becomes a
#                           SOURCE LIMITS line in the report) rather than
#                           losing the day. Gated to run only when attempt-2
#                           itself hit the auth refusal — if attempt-1 or
#                           attempt-2 already succeeded, this job is skipped
#                           entirely (see each job's `if:`).
#
# Enrichment happens BEFORE any Sheets/Drive write (scripts/journal/__main__.py
# ::cmd_run calls `_load_raw` — which reaches `pull_flex`'s greek enrichment —
# before `analysis.load()`, `report.build()`, or any writer), so a failed
# attempt (exit 5) leaves nothing half-written: no report, no page, no Sheets
# row, no Drive push. Each retry job runs `actions/checkout` fresh and starts
# from an empty disk, so nothing carries over between attempts either.
#
# COST: up to 3x the runner-minutes and up to 3x Playwright installs on the
# (rare, ~1 in 3 historically) days Barchart refuses every login. No duplicate
# WRITE risk: attempt-1/2's failure path never reaches a writer (above), and
# only ONE of the three jobs ever runs the writers (whichever one succeeds).

on:
  schedule:
    - cron: '15 22 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Session date to journal (YYYY-MM-DD). Blank = latest Flex trade_date.'
        required: false
        type: string

jobs:
  attempt-1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      exit_code: ${{ steps.evaluate.outputs.exit_code }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        # Full set, not requirements-compile.txt: scripts/journal/lib/greeks.py
        # opens a Playwright BarchartSession to backfill EOD greeks Flex never
        # carries.
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser
        # Unconditional, not gated on cache-hit — see scrape.yml/enrich-oi.yml's
        # history: a cache that is warm but missing the resolved pip version's
        # browser revision would otherwise leave it silently missing.
        run: playwright install --with-deps chromium

      - name: Run the daily trade journal (greeks required — attempt 1/3)
        id: run_journal
        # Masks a nonzero exit from failing the JOB outright — the "Evaluate"
        # step below decides, from the captured code, whether this is a
        # retryable Barchart auth refusal or a real failure.
        continue-on-error: true
        run: |
          set +e
          python -m scripts.journal --quiet ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit $rc
        env:
          # JOURNAL_GREEKS_REQUIRED=1: a refused Barchart login must RE-RAISE
          # here (EXIT_BARCHART_AUTH) rather than degrade — see the header note.
          JOURNAL_GREEKS_REQUIRED: '1'
          # Barchart — EOD greeks fallback (lib/greeks.py) and OI-history reads.
          BARCHART_EMAIL: ${{ secrets.BARCHART_EMAIL }}
          BARCHART_PASSWORD: ${{ secrets.BARCHART_PASSWORD }}
          SCRAPE_HEADLESS: 'true'
          # Google OAuth2 — same token as every other workflow here, covering
          # both the AnalysisClaude read (analysis.load()) and the
          # TradeJournal/OpenBook writes below.
          GOOGLE_OAUTH_TOKEN_JSON_CONTENT: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_CONTENT }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          # The journal's OWN Drive folder — where this run's report, card,
          # broker pull, page and archives go, since --quiet prints none of them
          # and the runner's disk does not outlive the job. NOT the flow folder
          # above: that one holds Barchart scrapes and may be shared on its own
          # terms, and this one holds account ids and live P&L.
          JOURNAL_DRIVE_FOLDER_ID: ${{ secrets.JOURNAL_DRIVE_FOLDER_ID }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          # The journal's OWN workbook (TradeJournal + OpenBook tabs) — a
          # separate spreadsheet from GOOGLE_SPREADSHEET_ID above so the trade
          # record can be shared, or kept unshared, independently.
          TRADE_JOURNAL_SPREADSHEET_ID: ${{ secrets.TRADE_JOURNAL_SPREADSHEET_ID }}
          # IBKR Flex — the only broker transport (Client Portal was deleted
          # 2026-08-15). IBKR_FLEX_OPEN_POSITIONS_QUERY_ID is optional but
          # strongly recommended: without it the open book is reconstructed by
          # netting fills instead of read from the broker's declared book.
          IBKR_ACCOUNT_ID: ${{ secrets.IBKR_ACCOUNT_ID }}
          IBKR_FLEX_TOKEN: ${{ secrets.IBKR_FLEX_TOKEN }}
          IBKR_FLEX_QUERY_TRADES_ID: ${{ secrets.IBKR_FLEX_QUERY_TRADES_ID }}
          IBKR_FLEX_OPEN_POSITIONS_QUERY_ID: ${{ secrets.IBKR_FLEX_OPEN_POSITIONS_QUERY_ID }}
          # Optional: a Flex trades query reports no account equity, and every
          # exposure cap is a fraction of it. Left unset, the risk section
          # reports "not evaluable" rather than guessing — never fatal.
          JOURNAL_NET_LIQUIDATION: ${{ secrets.JOURNAL_NET_LIQUIDATION }}

      - name: Evaluate this attempt
        id: evaluate
        if: always()
        run: |
          rc="${{ steps.run_journal.outputs.exit_code }}"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" = "0" ]; then
            echo "Journal run OK on attempt 1/3."
            exit 0
          fi
          if [ "$rc" = "5" ]; then
            echo "::warning::Barchart login refused on attempt 1/3 — retrying on a fresh runner (attempt 2/3)."
            exit 0
          fi
          echo "::error::Journal run failed on attempt 1/3 with exit code $rc (not a Barchart auth refusal) — failing without a retry."
          exit 1

  attempt-2:
    needs: attempt-1
    # Only when attempt 1 hit the Barchart auth refusal specifically — a
    # success (exit_code '0') or any OTHER failure already ended the workflow
    # via attempt-1's own "Evaluate" step (see its comment).
    if: needs.attempt-1.outputs.exit_code == '5'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      exit_code: ${{ steps.evaluate.outputs.exit_code }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run the daily trade journal (greeks required — attempt 2/3)
        id: run_journal
        continue-on-error: true
        run: |
          set +e
          python -m scripts.journal --quiet ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit $rc
        env:
          JOURNAL_GREEKS_REQUIRED: '1'
          BARCHART_EMAIL: ${{ secrets.BARCHART_EMAIL }}
          BARCHART_PASSWORD: ${{ secrets.BARCHART_PASSWORD }}
          SCRAPE_HEADLESS: 'true'
          GOOGLE_OAUTH_TOKEN_JSON_CONTENT: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_CONTENT }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          JOURNAL_DRIVE_FOLDER_ID: ${{ secrets.JOURNAL_DRIVE_FOLDER_ID }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          TRADE_JOURNAL_SPREADSHEET_ID: ${{ secrets.TRADE_JOURNAL_SPREADSHEET_ID }}
          IBKR_ACCOUNT_ID: ${{ secrets.IBKR_ACCOUNT_ID }}
          IBKR_FLEX_TOKEN: ${{ secrets.IBKR_FLEX_TOKEN }}
          IBKR_FLEX_QUERY_TRADES_ID: ${{ secrets.IBKR_FLEX_QUERY_TRADES_ID }}
          IBKR_FLEX_OPEN_POSITIONS_QUERY_ID: ${{ secrets.IBKR_FLEX_OPEN_POSITIONS_QUERY_ID }}
          JOURNAL_NET_LIQUIDATION: ${{ secrets.JOURNAL_NET_LIQUIDATION }}

      - name: Evaluate this attempt
        id: evaluate
        if: always()
        run: |
          rc="${{ steps.run_journal.outputs.exit_code }}"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" = "0" ]; then
            echo "Journal run OK on attempt 2/3."
            exit 0
          fi
          if [ "$rc" = "5" ]; then
            echo "::warning::Barchart login refused on attempt 2/3 — falling back to the final attempt (3/3), which journals WITHOUT greeks rather than losing the day."
            exit 0
          fi
          echo "::error::Journal run failed on attempt 2/3 with exit code $rc (not a Barchart auth refusal) — failing without a retry."
          exit 1

  attempt-3:
    needs: [attempt-1, attempt-2]
    # Only when attempt 2 ACTUALLY RAN (not skipped — see attempt-2's `if:`)
    # and itself hit the auth refusal. Any other outcome already ended the
    # workflow: a success at attempt 1 or 2, or a real failure at either.
    if: needs.attempt-2.result == 'success' && needs.attempt-2.outputs.exit_code == '5'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run the daily trade journal (final attempt 3/3 — degrades without greeks)
        # NO JOURNAL_GREEKS_REQUIRED here, and no exit-code capture: this is the
        # last runner. A refused Barchart login degrades to a greeks-less
        # journal (see scripts/journal/s01_pull.py::pull_flex) instead of
        # raising, exactly as this workflow always behaved before the retry
        # chain above existed — the day is journalled either way. Any OTHER
        # failure fails the job/workflow normally, as before.
        run: python -m scripts.journal --quiet ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
        env:
          BARCHART_EMAIL: ${{ secrets.BARCHART_EMAIL }}
          BARCHART_PASSWORD: ${{ secrets.BARCHART_PASSWORD }}
          SCRAPE_HEADLESS: 'true'
          GOOGLE_OAUTH_TOKEN_JSON_CONTENT: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_CONTENT }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          JOURNAL_DRIVE_FOLDER_ID: ${{ secrets.JOURNAL_DRIVE_FOLDER_ID }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          TRADE_JOURNAL_SPREADSHEET_ID: ${{ secrets.TRADE_JOURNAL_SPREADSHEET_ID }}
          IBKR_ACCOUNT_ID: ${{ secrets.IBKR_ACCOUNT_ID }}
          IBKR_FLEX_TOKEN: ${{ secrets.IBKR_FLEX_TOKEN }}
          IBKR_FLEX_QUERY_TRADES_ID: ${{ secrets.IBKR_FLEX_QUERY_TRADES_ID }}
          IBKR_FLEX_OPEN_POSITIONS_QUERY_ID: ${{ secrets.IBKR_FLEX_OPEN_POSITIONS_QUERY_ID }}
          JOURNAL_NET_LIQUIDATION: ${{ secrets.JOURNAL_NET_LIQUIDATION }}
