name: Options Scraper

# FRESH-RUNNER RETRY ON A REFUSED BARCHART LOGIN (added 2026-09-22). Barchart
# intermittently refuses a fresh login from a GitHub-hosted runner's IP —
# silent stay-on-/login, every in-process retry of one run failing together
# (lib/barchart/session.py::BarchartSession._LOGIN_ATTEMPTS already retries
# within one run; this is what to do once THAT is exhausted). A NEW runner
# (new IP) usually clears it, so the operator's decision is: retry on a fresh
# runner. scrape_flow.py has NO degrade path (unlike the journal), so all
# three attempts run the identical command; the LAST one just fails as this
# workflow always has if it also hits the refusal — see each job's `if:`.
# scripts/collector/scrape_flow.py exits BARCHART_AUTH_EXIT_CODE (5, shared
# with every other Barchart-touching entry point via lib/barchart/session.py)
# on an unhandled BarchartAuthError, which is what the "Evaluate" step below
# keys on to tell a retryable refusal apart from a real failure — the latter
# must still fail the workflow loudly and NOT be retried into more
# runner-minutes. COST: up to 3x the runner-minutes/Playwright installs on the
# (rare) hours this happens; each job's 15-minute timeout keeps a full 3-attempt
# chain to at most ~45 minutes against an hourly cron.

on:
  schedule:
    # flow — every hour at :30 from 13:30–21:30 UTC, Mon-Fri.
    # EDT (UTC-4): covers 9:30 AM – 5:30 PM ET; EST (UTC-5): covers 8:30 AM – 4:30 PM ET.
    - cron: '30 13-21 * * 1-5'
    # unusual — once at 22:00 UTC, Mon-Fri: market close (16:00 ET) + 1h buffer so data has settled.
    # 22:00 UTC = 18:00 ET in EDT (close +2h) / 17:00 ET in EST (close +1h) — always ≥1h after close.
    - cron: '0 22 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scrape mode'
        required: false
        default: 'flow'
        type: choice
        options:
          - flow
          - unusual

jobs:
  attempt-1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      exit_code: ${{ steps.evaluate.outputs.exit_code }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run scraper (attempt 1/3)
        id: run_scrape
        # Masks a nonzero exit from failing the JOB outright — the "Evaluate"
        # step below decides, from the captured code, whether this is a
        # retryable Barchart auth refusal or a real failure.
        continue-on-error: true
        run: |
          set +e
          python scripts/collector/scrape_flow.py --mode ${{ inputs.mode || (github.event.schedule == '0 22 * * 1-5' && 'unusual' || 'flow') }}
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit $rc
        env:
          BARCHART_EMAIL: ${{ secrets.BARCHART_EMAIL }}
          BARCHART_PASSWORD: ${{ secrets.BARCHART_PASSWORD }}
          GOOGLE_OAUTH_TOKEN_JSON_CONTENT: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_CONTENT }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          SCRAPE_HEADLESS: 'true'

      - name: Evaluate this attempt
        id: evaluate
        if: always()
        run: |
          rc="${{ steps.run_scrape.outputs.exit_code }}"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" = "0" ]; then
            echo "Scrape OK on attempt 1/3."
            exit 0
          fi
          if [ "$rc" = "5" ]; then
            echo "::warning::Barchart login refused on attempt 1/3 — retrying on a fresh runner (attempt 2/3)."
            exit 0
          fi
          echo "::error::Scrape failed on attempt 1/3 with exit code $rc (not a Barchart auth refusal) — failing without a retry."
          exit 1

  attempt-2:
    needs: attempt-1
    # Only when attempt 1 hit the Barchart auth refusal specifically — a
    # success (exit_code '0') or any OTHER failure already ended the workflow
    # via attempt-1's own "Evaluate" step (see its comment).
    if: needs.attempt-1.outputs.exit_code == '5'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      exit_code: ${{ steps.evaluate.outputs.exit_code }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run scraper (attempt 2/3)
        id: run_scrape
        continue-on-error: true
        run: |
          set +e
          python scripts/collector/scrape_flow.py --mode ${{ inputs.mode || (github.event.schedule == '0 22 * * 1-5' && 'unusual' || 'flow') }}
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit $rc
        env:
          BARCHART_EMAIL: ${{ secrets.BARCHART_EMAIL }}
          BARCHART_PASSWORD: ${{ secrets.BARCHART_PASSWORD }}
          GOOGLE_OAUTH_TOKEN_JSON_CONTENT: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_CONTENT }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          SCRAPE_HEADLESS: 'true'

      - name: Evaluate this attempt
        id: evaluate
        if: always()
        run: |
          rc="${{ steps.run_scrape.outputs.exit_code }}"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" = "0" ]; then
            echo "Scrape OK on attempt 2/3."
            exit 0
          fi
          if [ "$rc" = "5" ]; then
            echo "::warning::Barchart login refused on attempt 2/3 — trying the final attempt (3/3) on one more fresh runner."
            exit 0
          fi
          echo "::error::Scrape failed on attempt 2/3 with exit code $rc (not a Barchart auth refusal) — failing without a retry."
          exit 1

  attempt-3:
    needs: [attempt-1, attempt-2]
    # Only when attempt 2 ACTUALLY RAN (not skipped — see attempt-2's `if:`)
    # and itself hit the auth refusal. Any other outcome already ended the
    # workflow: a success at attempt 1 or 2, or a real failure at either.
    if: needs.attempt-2.result == 'success' && needs.attempt-2.outputs.exit_code == '5'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run scraper (final attempt 3/3)
        # No exit-code capture: scrape_flow.py has no degrade path, so this is
        # the last runner — if it also hits the refusal (or anything else),
        # the job fails exactly as this workflow always has.
        run: python scripts/collector/scrape_flow.py --mode ${{ inputs.mode || (github.event.schedule == '0 22 * * 1-5' && 'unusual' || 'flow') }}
        env:
          BARCHART_EMAIL: ${{ secrets.BARCHART_EMAIL }}
          BARCHART_PASSWORD: ${{ secrets.BARCHART_PASSWORD }}
          GOOGLE_OAUTH_TOKEN_JSON_CONTENT: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_CONTENT }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          SCRAPE_HEADLESS: 'true'
