name: Flow Pacemaker

# MANUAL FALLBACK for when GitHub's cron scheduler stops starting scrape.yml.
#
# Background (2026-08-28): scheduled runs drifted 3-12h late and the hourly flow
# crons were dropped entirely — 08-27 compiled to 501 rows (a single snapshot)
# against the usual 1200-1800. workflow_dispatch runs are NOT deprioritised the
# way schedule runs are, so this workflow is started BY HAND once and then paces
# itself: each job sleeps to the next scrape time and runs the scraper in-process,
# instead of asking the scheduler to start a fresh job every hour.
#
# The window starts at 15:00 UTC — 23:00 Singapore, the hour the pacemaker is
# dispatched by hand — and runs hourly to 21:00 UTC, which is the 16:00 ET close
# in EST and close +1h in EDT (same both-DST-regimes cover as scrape.yml's
# '30 13-21' cron). The unusual scrape then fires at 22:00 UTC, always >=1h after
# the close has settled.
#
# Two chained jobs are now MANDATORY, not merely prudent. A GitHub-hosted job is
# hard-killed at 6h and the full 15:00->22:05 window is ~7h, so no single job can
# hold it; split at 19:00 each half spans ~3h. Job B carries `if: always()` so a
# crash in A still leaves the close scrape covered; worst case you lose half the
# snapshots, not the night.
#
# This does NOT replace scrape.yml's crons — it is additive and dispatch-only.
# Compile is deliberately NOT included: compile-flow.yml takes a `date` input and
# gc_flow.py --last 3 sweeps the 3 most recent compiled dates, so a missed compile
# self-heals on the next daily pass.

on:
  workflow_dispatch:
    inputs:
      early_times:
        description: 'Job A flow scrape times, UTC HHMM, space-separated (1500 UTC = 2300 SGT)'
        required: false
        default: '1500 1600 1700 1800'
        type: string
      late_times:
        description: 'Job B flow scrape times, UTC HHMM, space-separated (2100 UTC = 0500 SGT)'
        required: false
        default: '1900 2000 2100'
        type: string
      unusual_time:
        description: 'Job B unusual scrape time, UTC HHMM. Blank = skip.'
        required: false
        default: '2200'
        type: string

jobs:
  early:
    # 350, not 240: a job dispatched an hour early spends that hour asleep, and a
    # timeout below the 6h hard kill would cut the last scrape of the leg rather
    # than the runner doing it. 350 lets the leg use its whole GitHub budget.
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      # Unconditional: gating this on a cache hit leaves the browser missing when
      # the cache is warm but incomplete.
      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Pace the early flow scrapes
        env:
          TIMES: ${{ inputs.early_times }}
          BARCHART_EMAIL: ${{ secrets.BARCHART_EMAIL }}
          BARCHART_PASSWORD: ${{ secrets.BARCHART_PASSWORD }}
          GOOGLE_OAUTH_TOKEN_JSON_CONTENT: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_CONTENT }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          SCRAPE_HEADLESS: 'true'
        run: bash .github/scripts/pace_scrapes.sh

  late:
    needs: early
    # Run even if the early half crashed or was cancelled — the 22:00 unusual
    # scrape is the single most valuable capture of the day.
    #
    # Residual limit, unchanged by the widened window: this leg's 6h budget starts
    # when it starts, so if `early` dies within minutes of dispatch, `late` begins
    # ~15:05 and is hard-killed ~21:05 — before the 22:00 unusual scrape. Nothing
    # in a workflow can delay a job's start, so the fix is operational: if `early`
    # fails early, re-dispatch with early_times blank and let the fresh `late` leg
    # start its clock later.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Pace the late flow scrapes and the close scrape
        env:
          TIMES: ${{ inputs.late_times }}
          UNUSUAL_TIME: ${{ inputs.unusual_time }}
          BARCHART_EMAIL: ${{ secrets.BARCHART_EMAIL }}
          BARCHART_PASSWORD: ${{ secrets.BARCHART_PASSWORD }}
          GOOGLE_OAUTH_TOKEN_JSON_CONTENT: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_CONTENT }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          SCRAPE_HEADLESS: 'true'
        run: bash .github/scripts/pace_scrapes.sh
