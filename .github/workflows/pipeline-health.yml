name: Pipeline Health

# The watchdog. Every other workflow here writes to Drive or Sheets and notifies
# nobody; GitHub only emails when a SCHEDULED WORKFLOW FAILS, which misses the
# failure modes that actually bite — chiefly that enrich-oi / fetch-counterpart-iv
# / backfill-mech-cell have no cron at all and fire only on a SUCCESSFUL Compile
# Flow. If Compile Flow dies, those three never run, and a job that never ran
# emails nobody.
#
# So this job asserts the EVIDENCE in Drive/Sheets rather than any exit status,
# and fails when it is missing. Its failure IS the alert.

on:
  # PRIMARY: chain off Enrich OI alone, so the check runs as soon as the day's
  # chain is genuinely finished rather than at a guessed hour.
  #
  # Compile Flow fans out to THREE workflows in PARALLEL, but Enrich OI is the
  # long pole — it is routinely the last to finish (4h27m on 2026-09-02) and it
  # alone produces three of the seven stages asserted below, so firing on an
  # earlier sibling would report those MISSING while it is still running, which
  # is how an operator learns to ignore the alarm.
  #
  # This used to listen to all three and stand down every run but the last one
  # in flight. That guard was dropped on 2026-09-09: it was racy (when the three
  # completed in the same second on 2026-09-09 none of them saw a sibling still
  # running, and all three ran the full check), and it spent an API round trip
  # per sibling to answer a question the long pole already answers.
  #
  # KNOWN EXPOSURE: Fetch Counterpart IV occasionally outlasts Enrich OI —
  # 2026-09-03 it ended 03:49 UTC against Enrich OI's 01:23. On such a night the
  # `counterpart_iv` stage (lag_sessions: 0) is judged before its enricher has
  # written, and the run fails as a false alarm. The scheduled backstop below
  # re-checks the same window hours later and passes, so the condition is
  # self-clearing within a day; give that stage a lag_sessions if it stops being.
  #
  # No conclusion gate — a run that FAILED is exactly when this check is most
  # worth running.
  workflow_run:
    workflows: ["Enrich OI"]
    types: [completed]
  schedule:
    # BACKSTOP, not the primary path. Kept because the chain above only fires
    # when Compile Flow succeeded: if Compile Flow dies, Enrich OI never runs,
    # nothing completes, and a watchdog wired only to its completion would go
    # silent exactly when it is needed. Tue-Sat because each run audits the
    # previous weekday's chain.
    #
    # 01:45 UTC nominal (09:45 SGT). Note that GitHub delays cron on this repo
    # by hours in practice (observed dispatch 06:26-13:22 UTC), which is another
    # reason the workflow_run chain above is the path that should normally win.
    - cron: '45 1 * * 2-6'
  workflow_dispatch:
    inputs:
      as_of:
        description: 'Check as of this date (YYYY-MM-DD). Blank = today.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          # The checker reads the newest commit's age to warn before GitHub's
          # 60-day no-commit rule disables every schedule in this repo —
          # including this one. Depth 1 is enough for `git log -1`.
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        # The FULL set, not requirements-compile.txt: the enrichment-coverage
        # helpers live beside the enrichers, so importing them transitively pulls
        # playwright (lib/barchart) and scipy (backtest.helpers) even though this
        # job never scrapes. The pip packages are enough to satisfy the imports —
        # deliberately NO `playwright install`, since no browser is ever launched.
        run: pip install -r requirements.txt

      - name: Check the collection pipeline
        # No continue-on-error, no `|| true`. The exit code is the alert.
        run: python scripts/check_pipeline.py ${{ inputs.as_of && format('--as-of {0}', inputs.as_of) || '' }}
        env:
          GOOGLE_OAUTH_TOKEN_JSON_CONTENT: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_CONTENT }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          # Wires the journal stage live (scripts/check_pipeline.py::JOURNAL_STAGE):
          # a SEPARATE workbook from GOOGLE_SPREADSHEET_ID above, so its own id
          # has to be passed explicitly or the stage degrades to NOT_DUE forever.
          TRADE_JOURNAL_SPREADSHEET_ID: ${{ secrets.TRADE_JOURNAL_SPREADSHEET_ID }}
          # GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT is deliberately absent: Sheets
          # authenticates with the same OAuth2 token as Drive
          # (lib/sheets_client.py::_get_client), and no Python in this repo reads
          # a service-account variable.
