name: Pipeline Health

# The watchdog. Every other workflow here writes to Drive or Sheets and notifies
# nobody; GitHub only emails when a SCHEDULED WORKFLOW FAILS, which misses the
# failure modes that actually bite — chiefly that enrich-oi / fetch-counterpart-iv
# / backfill-mech-cell have no cron at all and fire only on a SUCCESSFUL Compile
# Flow. If Compile Flow dies, those three never run, and a job that never ran
# emails nobody.
#
# So this job asserts the EVIDENCE in Drive/Sheets rather than any exit status,
# and fails when it is missing. Its failure IS the alert.

on:
  # PRIMARY: chain off the enrichment fan-out so the check runs as soon as the
  # day's chain is genuinely finished, rather than at a guessed hour.
  #
  # Compile Flow fans out to THREE workflows that run in PARALLEL, and which one
  # finishes last varies by night (observed: Fetch Counterpart IV ended 00:28
  # while Enrich OI ran to 01:19 on 2026-09-05; the order reversed on 09-03).
  # Enrich OI alone produces three of the seven stages asserted below, so firing
  # on the first sibling to finish would report those MISSING while it is still
  # running — a false alarm, which is how an operator learns to ignore the alarm.
  #
  # Hence: listen to all three, and let the `guard` step below stand down every
  # run except the last one still in flight. No conclusion gate — a sibling that
  # FAILED is exactly when this check is most worth running.
  workflow_run:
    workflows: ["Enrich OI", "Fetch Counterpart IV", "Backfill Mech Cell"]
    types: [completed]
  schedule:
    # BACKSTOP, not the primary path. Kept because the chain above only fires
    # when Compile Flow succeeded: if Compile Flow dies, none of the three
    # enrichers run, nothing completes, and a watchdog wired only to their
    # completion would go silent exactly when it is needed. Tue-Sat because each
    # run audits the previous weekday's chain.
    #
    # 01:45 UTC nominal (09:45 SGT). Note that GitHub delays cron on this repo
    # by hours in practice (observed dispatch 06:26-13:22 UTC), which is another
    # reason the workflow_run chain above is the path that should normally win.
    - cron: '45 1 * * 2-6'
  workflow_dispatch:
    inputs:
      as_of:
        description: 'Check as of this date (YYYY-MM-DD). Blank = today.'
        required: false
        type: string

permissions:
  contents: read
  # Read-only listing of the sibling workflows' runs, for the guard step.
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Stand down unless this is the last enricher to finish
        # Deliberately does NOT wait: waiting would idle a runner for the hour
        # or more Enrich OI routinely takes (4h27m on 2026-09-02). Instead every
        # sibling completion asks "is anyone else still going?" and only the
        # last one answers no, so exactly one check runs per night at the moment
        # the chain is actually complete.
        #
        # The triggering run is excluded by id: it is `completed` by definition
        # of the event, but the API can still list it for a beat.
        id: guard
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGER_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          busy=0
          for wf in enrich-oi.yml fetch-counterpart-iv.yml backfill-mech-cell.yml; do
            for st in queued in_progress; do
              n=$(gh api \
                    "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/runs?status=${st}&per_page=30" \
                    --jq "[.workflow_runs[] | select(.id != ${TRIGGER_ID})] | length")
              if [ "$n" -gt 0 ]; then
                echo "still in flight: ${wf} (${st}=${n})"
              fi
              busy=$(( busy + n ))
            done
          done
          if [ "$busy" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Standing down — a sibling enricher is still running; it will run the check."
          else
            echo "Last enricher standing — running the check."
          fi

      - uses: actions/checkout@v5
        if: ${{ steps.guard.outputs.skip != 'true' }}
        with:
          # The checker reads the newest commit's age to warn before GitHub's
          # 60-day no-commit rule disables every schedule in this repo —
          # including this one. Depth 1 is enough for `git log -1`.
          fetch-depth: 1

      - uses: actions/setup-python@v6
        if: ${{ steps.guard.outputs.skip != 'true' }}
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        # The FULL set, not requirements-compile.txt: the enrichment-coverage
        # helpers live beside the enrichers, so importing them transitively pulls
        # playwright (lib/barchart) and scipy (backtest.helpers) even though this
        # job never scrapes. The pip packages are enough to satisfy the imports —
        # deliberately NO `playwright install`, since no browser is ever launched.
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: pip install -r requirements.txt

      - name: Check the collection pipeline
        # No continue-on-error, no `|| true`. The exit code is the alert.
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: python scripts/check_pipeline.py ${{ inputs.as_of && format('--as-of {0}', inputs.as_of) || '' }}
        env:
          GOOGLE_OAUTH_TOKEN_JSON_CONTENT: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_CONTENT }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          # GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT is deliberately absent: Sheets
          # authenticates with the same OAuth2 token as Drive
          # (lib/sheets_client.py::_get_client), and no Python in this repo reads
          # a service-account variable.
