name: Fetch Counterpart IV

# Backfills the missing call/put leg's settlement IV for single-sided in-window
# matched pairs, so the analysis rollup's IVspr/IVskew are populated (~96% vs ~2%
# on flow alone). Unlike Enrich OI, this doesn't touch the compiled flow file —
# it writes a separate per-date sidecar (counterpart-iv-{YYYYMMDD}.csv) to Drive,
# so it's its own workflow rather than a step in Enrich OI. IV is as-of trade
# date D (available same evening, no D+1 wait), so this chains directly off
# Compile Flow and enriches the latest date only (no --backfill: a full
# historical sweep risks the job timeout). Idempotent per contract via the
# sidecar's fetched_on marker.
#
# Needs the full requirements (Playwright) + Barchart creds to scrape per-contract
# price history; writes the sidecar CSV back to Drive (no Sheets access needed).
#
# FRESH-RUNNER RETRY ON A REFUSED BARCHART LOGIN (added 2026-09-22). Barchart
# intermittently refuses a fresh login from a GitHub-hosted runner's IP —
# silent stay-on-/login, every in-process retry of one run failing together
# (lib/barchart/session.py::BarchartSession._LOGIN_ATTEMPTS already retries
# within one run; this is what to do once THAT is exhausted). A NEW runner
# (new IP) usually clears it, so the operator's decision is: retry on a fresh
# runner. This script has no degrade path, so all three attempts run the
# identical command; the LAST one just fails as this workflow always has if it
# also hits the refusal — see each job's `if:`. scripts/collector/
# fetch_counterpart_iv.py exits BARCHART_AUTH_EXIT_CODE (5, shared with every
# other Barchart-touching entry point via lib/barchart/session.py) on an
# unhandled BarchartAuthError, which is what the "Evaluate" step below keys on
# to tell a retryable refusal apart from a real failure — the latter must
# still fail the workflow loudly and NOT be retried into more runner-minutes.

on:
  # Chain off Compile Flow so the day's compiled file exists before we fetch.
  workflow_run:
    workflows: ["Compile Flow"]
    types: [completed]
  workflow_dispatch:
    inputs:
      date:
        description: 'Single trading date to enrich (YYYY-MM-DD). Blank = latest compiled date.'
        required: false
        type: string

jobs:
  attempt-1:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # On the workflow_run trigger, only proceed if Compile Flow succeeded. Manual
    # runs (workflow_dispatch) always proceed.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      exit_code: ${{ steps.evaluate.outputs.exit_code }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        # Full set — the scraper needs Playwright/etc., not just the slim compile deps.
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser
        # Unconditional (not gated on cache-hit): the cache key only tracks
        # requirements.txt, but playwright>=1.44 is unpinned, so a newer resolved
        # pip version can need a browser revision the cache doesn't have (same
        # issue hit in scrape.yml — see its history). `playwright install` is a
        # no-op when the required revision is already cached, so this stays cheap.
        run: playwright install --with-deps chromium

      - name: Backfill matched-pair counterpart IV (latest date only, attempt 1/3)
        id: run_fetch
        continue-on-error: true
        run: |
          set +e
          python scripts/collector/fetch_counterpart_iv.py ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit $rc
        env:
          BARCHART_EMAIL: ${{ secrets.BARCHART_EMAIL }}
          BARCHART_PASSWORD: ${{ secrets.BARCHART_PASSWORD }}
          GOOGLE_OAUTH_TOKEN_JSON_CONTENT: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_CONTENT }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          SCRAPE_HEADLESS: 'true'

      - name: Evaluate this attempt
        id: evaluate
        if: always()
        run: |
          rc="${{ steps.run_fetch.outputs.exit_code }}"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" = "0" ]; then
            echo "Fetch OK on attempt 1/3."
            exit 0
          fi
          if [ "$rc" = "5" ]; then
            echo "::warning::Barchart login refused on attempt 1/3 — retrying on a fresh runner (attempt 2/3)."
            exit 0
          fi
          echo "::error::Fetch failed on attempt 1/3 with exit code $rc (not a Barchart auth refusal) — failing without a retry."
          exit 1

  attempt-2:
    needs: attempt-1
    # Only when attempt 1 hit the Barchart auth refusal specifically — a
    # success (exit_code '0') or any OTHER failure already ended the workflow
    # via attempt-1's own "Evaluate" step (see its comment). Also naturally
    # skipped when attempt-1's own gate (workflow_dispatch / Compile Flow
    # succeeded) was false, since attempt-1 then never ran and set no output.
    if: needs.attempt-1.outputs.exit_code == '5'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      exit_code: ${{ steps.evaluate.outputs.exit_code }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Backfill matched-pair counterpart IV (latest date only, attempt 2/3)
        id: run_fetch
        continue-on-error: true
        run: |
          set +e
          python scripts/collector/fetch_counterpart_iv.py ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit $rc
        env:
          BARCHART_EMAIL: ${{ secrets.BARCHART_EMAIL }}
          BARCHART_PASSWORD: ${{ secrets.BARCHART_PASSWORD }}
          GOOGLE_OAUTH_TOKEN_JSON_CONTENT: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_CONTENT }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          SCRAPE_HEADLESS: 'true'

      - name: Evaluate this attempt
        id: evaluate
        if: always()
        run: |
          rc="${{ steps.run_fetch.outputs.exit_code }}"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" = "0" ]; then
            echo "Fetch OK on attempt 2/3."
            exit 0
          fi
          if [ "$rc" = "5" ]; then
            echo "::warning::Barchart login refused on attempt 2/3 — trying the final attempt (3/3) on one more fresh runner."
            exit 0
          fi
          echo "::error::Fetch failed on attempt 2/3 with exit code $rc (not a Barchart auth refusal) — failing without a retry."
          exit 1

  attempt-3:
    needs: [attempt-1, attempt-2]
    # Only when attempt 2 ACTUALLY RAN (not skipped) and itself hit the auth
    # refusal. Any other outcome already ended the workflow.
    if: needs.attempt-2.result == 'success' && needs.attempt-2.outputs.exit_code == '5'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Backfill matched-pair counterpart IV (latest date only, final attempt 3/3)
        # No exit-code capture: this script has no degrade path, so this is the
        # last runner — if it also hits the refusal (or anything else), the job
        # fails exactly as this workflow always has.
        run: python scripts/collector/fetch_counterpart_iv.py ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
        env:
          BARCHART_EMAIL: ${{ secrets.BARCHART_EMAIL }}
          BARCHART_PASSWORD: ${{ secrets.BARCHART_PASSWORD }}
          GOOGLE_OAUTH_TOKEN_JSON_CONTENT: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_CONTENT }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          SCRAPE_HEADLESS: 'true'
