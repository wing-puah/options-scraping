name: Compile Flow

# Runs once a day, after the Options Scraper's 22:00 UTC unusual download, by
# which time all of the day's hourly flow snapshots are in Drive. Two steps:
#   1. compile_flow.py — dedup the day's snapshots into one compiled CSV per type.
#   2. gc_flow.py --last 3 — trash raw snapshots that are verified-present in
#      their compiled file, over the 3 most recent compiled dates (so a missed
#      run still self-heals the next day, without re-listing months of Drive
#      history that was collected long ago).

on:
  schedule:
    # 22:30 UTC, Mon-Fri — 30 min after the unusual scrape (22:00 UTC) so it has
    # finished uploading. Compiles the current ET trading day.
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Trading date to compile (YYYY-MM-DD). Blank = today (ET).'
        required: false
        type: string

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          # Key the pip cache on the slim file this job actually installs.
          cache-dependency-path: requirements-compile.txt

      - name: Install Python dependencies
        # Slim set — compile_flow.py + gc_flow.py only need Drive + pandas, not the
        # full requirements.txt (Playwright/scipy/yfinance/gspread). Far less
        # to download and install than the scraper job.
        run: pip install -r requirements-compile.txt

      - name: Compile daily flow
        # NEVER derive the trading day from the runner's clock. GitHub's scheduler
        # starts this job late by anywhere from minutes to several hours (observed:
        # the 2026-08-31 22:30 UTC slot ran at 2026-09-01 01:19 UTC, the 09-01 slot
        # at 09-02 00:21 UTC), so `date -u` had already rolled past midnight and the
        # job compiled an EMPTY next date, exited 0, and left the real trading day
        # uncompiled. That silent success is why 09-01 had 22 snapshots and no
        # compiled file. ET is not a fix either: a >5h delay rolls the ET day too.
        #
        # Instead compile a 3-day window and let --skip-existing decide: a date
        # already compiled is left alone (recompiling would drop enrich-oi's
        # columns), a date with no snapshots is a no-op, and a missed run heals on
        # the next pass. Same self-healing shape as `gc_flow.py --last 3` below and
        # `build_baseline.py --backfill`. A manual dispatch still compiles exactly
        # the date asked for, unconditionally.
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python scripts/compile_flow.py --date "${{ inputs.date }}"
          else
            python scripts/compile_flow.py \
              --start "$(TZ=America/New_York date -d '3 days ago' +%Y-%m-%d)" \
              --end   "$(TZ=America/New_York date +%Y-%m-%d)" \
              --skip-existing
          fi
        env:
          GOOGLE_OAUTH_TOKEN_JSON_CONTENT: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_CONTENT }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}

      - name: Garbage-collect compiled raw snapshots
        # Independently re-verifies each date's compile before trashing its raws.
        # Bounded to the 3 most recent compiled dates: enough that a missed run
        # heals on the next daily pass, while --all re-checked every date back to
        # the start of the corpus and trashed nothing for almost all of them.
        run: python scripts/gc_flow.py --last 3
        env:
          GOOGLE_OAUTH_TOKEN_JSON_CONTENT: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_CONTENT }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}

      - name: Refresh SPY/VIX mech-regime table
        # Production input to the BEAR_HE exit override (config/backtest.yml
        # §simulation.regime_exit) and to `mech_cell` on the analysis row. Runs
        # here because 22:30 UTC is after the US close, so today's closes exist.
        # Replaces the single Drive-root file wholesale; `make mech-regime`
        # pulls it back down before any local backtest/analyze.
        run: python scripts/collector/fetch_mech_regime.py
        env:
          GOOGLE_OAUTH_TOKEN_JSON_CONTENT: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_CONTENT }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}

      - name: Append daily baseline row
        # Market-level aggregates → BaselineDaily tab (regime baseline for
        # /options analyze). --backfill is idempotent and computes only dates
        # missing from the tab, so a missed day self-heals on the next run.
        run: python scripts/build_baseline.py --backfill
        env:
          GOOGLE_OAUTH_TOKEN_JSON_CONTENT: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_CONTENT }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
